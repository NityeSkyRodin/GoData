<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F2 Telemetry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;900&family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col lg:flex-row min-h-screen">

    <header class="lg:hidden sticky top-0 z-50 bg-[#0B0E14]/95 backdrop-blur border-b border-[#232734] px-5 h-16 flex items-center justify-between">
        <div class="font-header text-2xl font-black italic tracking-wider">
            F2<span class="text-[#0090D0]">.</span>TELEMETRY
        </div>
        <button id="mobile-menu-btn" class="w-10 h-10 slanted bg-[#151821] flex items-center justify-center text-xl text-[#0090D0]">
            ☰
        </button>
    </header>

    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-40 w-64 h-screen bg-[#0B0E14] border-r border-[#232734] transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">
        <div class="hidden lg:block px-6 py-8 border-b border-[#232734]">
            <div class="font-header text-4xl font-black italic tracking-wide">
                F2<span class="text-[#0090D0]">.</span>TM
            </div>
            <div class="text-[10px] uppercase tracking-[0.3em] text-[#0090D0] font-bold mt-1">
                Private League
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto p-4 space-y-6">
            <div>
                <div class="text-[10px] uppercase tracking-widest text-slate-600 font-bold px-3 mb-2">Championship</div>
                <button id="nav-overview" class="w-full flex items-center gap-3 px-3 py-3 text-white bg-[#0090D0] slanted font-bold tracking-wider text-sm transition-all shadow-lg shadow-[#0090D0]/20">
                    OVERVIEW
                </button>
            </div>

            <div>
                <div class="text-[10px] uppercase tracking-widest text-slate-600 font-bold px-3 mb-2">Race Weekends</div>
                <div id="race-list" class="space-y-1"></div>
            </div>
        </nav>
    </aside>

    <main class="flex-1 p-5 lg:p-10 max-w-[1400px]">

        <div id="view-overview">
            <div class="mb-10">
                <div class="flex items-center gap-3 mb-2">
                    <span class="px-2 py-1 slanted bg-[#0090D0] text-[10px] font-black uppercase tracking-widest text-white">Season 2026</span>
                    <span id="season-status" class="text-[10px] uppercase tracking-widest text-slate-500 font-bold"></span>
                </div>
                <h1 class="font-header text-6xl md:text-8xl font-black uppercase italic tracking-tighter">STANDINGS</h1>
            </div>

            <div id="stats-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-10"></div>

            <div class="bg-[#151821] border border-[#232734] slanted p-5 lg:p-8">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                    <h2 class="font-header text-3xl font-black uppercase italic tracking-wide">Classification</h2>
                    <div class="flex gap-2 bg-[#0B0E14] p-1 slanted">
                        <button id="toggle-drivers" class="px-6 py-2 slanted text-xs font-bold uppercase tracking-wider bg-[#0090D0] text-white transition-colors">Drivers</button>
                        <button id="toggle-teams" class="px-6 py-2 slanted text-xs font-bold uppercase tracking-wider text-slate-500 hover:text-white transition-colors">Teams</button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full min-w-[500px]">
                        <thead>
                            <tr class="text-[10px] uppercase tracking-[0.2em] text-slate-500 border-b border-[#232734]">
                                <th class="text-left py-3 px-4 w-16">Pos</th>
                                <th id="standings-name-header" class="text-left py-3 px-4">Driver</th>
                                <th id="standings-team-header" class="text-left py-3 px-4">Team</th>
                                <th class="text-right py-3 px-4">Points</th>
                            </tr>
                        </thead>
                        <tbody id="standings-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-race" class="hidden">
            <div class="mb-10">
                <div class="flex items-center gap-3 mb-2">
                    <span class="px-2 py-1 slanted bg-[#0090D0] text-[10px] font-black uppercase tracking-widest text-white">Event</span>
                    <span id="race-subtitle" class="text-[10px] uppercase tracking-widest text-slate-500 font-bold"></span>
                </div>
                <h1 id="race-title" class="font-header text-5xl md:text-7xl font-black uppercase italic tracking-tighter"></h1>
            </div>

            <div id="session-tabs" class="flex gap-2 mb-6 overflow-x-auto pb-2"></div>

            <div class="bg-[#151821] border border-[#232734] slanted p-5 lg:p-8 relative overflow-hidden">
                <div class="absolute top-0 right-0 opacity-5 pointer-events-none font-header font-black italic text-[200px] leading-none transform translate-x-10 -translate-y-10">F2</div>
                
                <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4 border-b border-[#232734] pb-6">
                    <div>
                        <h2 id="session-title" class="font-header text-3xl font-black uppercase italic tracking-wide text-[#0090D0]"></h2>
                        <div id="session-description" class="text-xs uppercase tracking-widest text-slate-500 font-bold mt-1"></div>
                    </div>
                    
                    <div id="race-winner-card" class="text-right">
                        <div class="text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-1">Session Winner</div>
                        <div id="race-winner" class="font-header text-3xl font-black uppercase italic text-white"></div>
                    </div>
                </div>

                <div class="overflow-x-auto relative z-10">
                    <table class="w-full min-w-[800px]">
                        <thead>
                            <tr class="text-[10px] uppercase tracking-[0.2em] text-slate-500 border-b border-[#232734]">
                                <th class="text-left py-3 px-3 md:px-4 w-12">Pos</th>
                                <th class="text-left py-3 px-3 md:px-4 w-12">#</th>
                                <th class="text-left py-3 px-3 md:px-4">Driver</th>
                                <th class="text-left py-3 px-3 md:px-4">Team</th>
                                <th class="text-center py-3 px-3 md:px-4">Laps</th>
                                <th class="text-left py-3 px-3 md:px-4">Best Lap</th>
                                <th class="text-left py-3 px-3 md:px-4">Time</th>
                                <th class="text-center py-3 px-3 md:px-4">Status</th>
                                <th class="text-right py-3 px-3 md:px-4">Points</th>
                            </tr>
                        </thead>
                        <tbody id="race-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
